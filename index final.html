<!DOCTYPE html>
<html>
<head>
    <title>Fake Store Dashboard</title>
</head>
<body>

    <h1>Fake Store Product Dashboard</h1>

    <p id="status">Loading Products...</p>

    <input type="text" id="search" placeholder="Search Product">

    <select id="category">
        <option value="all">All</option>
        <option value="men's clothing">Men's Clothing</option>
        <option value="women's clothing">Women's Clothing</option>
        <option value="electronics">Electronics</option>
        <option value="jewelery">Jewelry</option>
    </select>

    <h3>Cart Count: <span id="cartCount">0</span></h3>

    <h2>Statistics</h2>
    <p>Total Products: <span id="totalProducts"></span></p>
    <p>Average Price: <span id="avgPrice"></span></p>
    <p>Highest Price Product: <span id="highest"></span></p>
    <p>Lowest Price Product: <span id="lowest"></span></p>

    <h2>Cart</h2>
    <div id="cartItems"></div>

    <h2>Products</h2>
    <div id="products"></div>

    <script src="js final.js">j</script>

</body>
</html>
